<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">
  <title>Nowa Muzyka 2026</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d0d0d;
      color: #ddd;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── HEADER ────────────────────────────────────── */
    #app-header {
      flex-shrink: 0;
      background: #0d0d0d;
      border-bottom: 1px solid #1c1c1c;
      padding: 12px 14px 11px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .festival-label {
      font-size: 10px;
      letter-spacing: 0.16em;
      color: #444;
      text-transform: uppercase;
    }

    /* ── USER SWITCHER ──────────────────────────────── */
    .user-switcher {
      position: relative;
    }

    .user-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 5px 10px 5px 8px;
      color: #bbb;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }

    .user-avatar {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      color: #888;
      flex-shrink: 0;
    }

    .user-caret {
      font-size: 9px;
      color: #555;
      margin-left: 1px;
    }

    .user-menu {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      overflow: hidden;
      z-index: 50;
      min-width: 130px;
    }

    .user-menu.open { display: block; }

    .user-menu-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 14px;
      color: #aaa;
      border-bottom: 1px solid #222;
    }
    .user-menu-item:last-child { border-bottom: none; }
    .user-menu-item:active { background: #222; }
    .user-menu-item.active-user { color: #F59E0B; }
    .user-menu-item.active-user .user-avatar { background: rgba(245,158,11,0.2); color: #F59E0B; }

    .day-tabs {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .day-tabs::-webkit-scrollbar { display: none; }

    .day-tab {
      flex-shrink: 0;
      padding: 6px 14px;
      border-radius: 16px;
      border: 1px solid #262626;
      background: transparent;
      color: #666;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .day-tab.active {
      background: #e8e8e8;
      color: #0d0d0d;
      border-color: #e8e8e8;
    }

    /* ── TIMETABLE GRID ────────────────────────────── */
    #timetable-scroll {
      flex: 1;
      overflow: auto;
      overscroll-behavior: contain;
    }

    #timetable-inner {
      position: relative;
      /* width set by JS */
    }

    /* stage header row */
    #stage-headers {
      position: sticky;
      top: 0;
      display: flex;
      background: #0d0d0d;
      border-bottom: 1px solid #1c1c1c;
      z-index: 20;
    }

    .header-corner {
      flex-shrink: 0;
      position: sticky;
      left: 0;
      background: #0d0d0d;
      z-index: 30;
    }

    .stage-header-cell {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 8px 6px;
      border-left: 1px solid #1c1c1c;
    }

    .stage-header-name {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #999;
      line-height: 1.2;
    }

    .stage-header-sub {
      font-size: 9px;
      color: #444;
      margin-top: 2px;
      line-height: 1.2;
    }

    /* grid body */
    #grid-body {
      display: flex;
      position: relative;
    }

    #time-axis {
      flex-shrink: 0;
      position: sticky;
      left: 0;
      background: #0d0d0d;
      z-index: 10;
      border-right: 1px solid #1c1c1c;
      position: sticky;
      left: 0;
    }

    .time-label {
      position: absolute;
      right: 6px;
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      color: #444;
      transform: translateY(-50%);
      white-space: nowrap;
    }

    .time-label.hour { color: #555; }

    /* stage column */
    .stage-col {
      flex-shrink: 0;
      position: relative;
      border-left: 1px solid #1a1a1a;
    }

    /* hour guide lines */
    .hour-line {
      position: absolute;
      left: 0; right: 0;
      height: 1px;
      background: #1a1a1a;
      pointer-events: none;
    }
    .hour-line.major {
      background: #222;
    }

    /* act block */
    .act-block {
      position: absolute;
      left: 4px;
      right: 4px;
      border-radius: 6px;
      padding: 5px 7px;
      cursor: pointer;
      background: #1a1a1a;
      border: 1px solid #252525;
      overflow: hidden;
      transition: border-color 0.12s, background 0.12s;
      -webkit-user-select: none;
      user-select: none;
    }
    .act-block:active { opacity: 0.8; }

    .act-block.headliner {
      background: #1c1a14;
      border-color: #2e2a1a;
    }

    .act-block.maybe {
      background: rgba(245, 158, 11, 0.10);
      border-color: rgba(245, 158, 11, 0.5);
    }
    .act-block.mustsee {
      background: rgba(34, 197, 94, 0.10);
      border-color: rgba(34, 197, 94, 0.5);
    }

    .act-name {
      font-size: 11px;
      font-weight: 600;
      color: #ccc;
      line-height: 1.25;
      word-break: break-word;
    }
    .act-block.headliner .act-name { color: #ddd; }
    .act-block.maybe   .act-name   { color: #F59E0B; }
    .act-block.mustsee .act-name   { color: #22C55E; }

    .act-time {
      font-size: 9px;
      color: #555;
      margin-top: 3px;
      font-variant-numeric: tabular-nums;
    }
    .act-block.headliner .act-time { color: #4a4020; }
    .act-block.maybe   .act-time   { color: #7a5010; }
    .act-block.mustsee .act-time   { color: #156030; }

    .act-markers {
      display: flex;
      gap: 2px;
      margin-top: 4px;
      flex-wrap: wrap;
    }
    .act-marker {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      font-size: 8px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .act-marker.maybe   { background: rgba(245,158,11,0.22); color: #F59E0B; }
    .act-marker.mustsee { background: rgba(34,197,94,0.22);  color: #22C55E; }

    .time-now-line {
      position: absolute;
      left: 0; right: 0;
      height: 2px;
      background: #ef4444;
      pointer-events: none;
      z-index: 5;
    }
    .time-now-line::before {
      content: '';
      position: absolute;
      left: -1px; top: -3px;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #ef4444;
    }


    /* ── MODAL ─────────────────────────────────────── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 100;
      align-items: flex-end;
    }
    .overlay.open { display: flex; }

    .modal {
      background: #141414;
      border-top: 1px solid #222;
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-height: 80dvh;
      overflow-y: auto;
      padding: 16px 20px 48px;
      animation: slideUp 0.2s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    .modal-handle {
      width: 32px; height: 3px;
      background: #2e2e2e; border-radius: 2px;
      margin: 0 auto 18px;
    }

    .modal-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 10px;
    }

    .modal-name {
      flex: 1;
      font-size: 20px;
      font-weight: 600;
      color: #f0f0f0;
      line-height: 1.2;
    }

    .modal-close {
      background: #1e1e1e;
      border: none;
      color: #666;
      width: 28px; height: 28px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }

    .modal-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 14px;
    }
    .modal-tag {
      background: #1e1e1e;
      color: #666;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
    }

    .modal-bio {
      font-size: 14px;
      color: #888;
      line-height: 1.65;
      margin-bottom: 22px;
    }

    .modal-fav-btns {
      display: flex;
      gap: 8px;
    }
    .modal-fav-btn {
      flex: 1;
      padding: 13px 8px;
      border-radius: 12px;
      border: 1px solid #2a2a2a;
      background: transparent;
      color: #555;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .modal-fav-btn.maybe.on {
      background: rgba(245, 158, 11, 0.12);
      border-color: rgba(245, 158, 11, 0.6);
      color: #F59E0B;
    }
    .modal-fav-btn.mustsee.on {
      background: rgba(34, 197, 94, 0.12);
      border-color: rgba(34, 197, 94, 0.6);
      color: #22C55E;
    }
  </style>
</head>

<div id="app-header">
  <div class="header-top">
    <div class="festival-label">Nowa Muzyka · Katowice 2026</div>
    <div class="user-switcher" id="userSwitcher">

      <div class="user-menu" id="userMenu"></div>
    </div>
  </div>
  <div class="day-tabs" id="dayTabs"></div>
</div>

<!-- timetable grid -->
<div id="timetable-scroll">

    <div id="stage-headers"></div>
    <div id="grid-body">
      <div id="time-axis"></div>
      <!-- stage columns injected by JS -->
    </div>
  </div>
</div>

<!-- modal -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal">
    <div class="modal-handle"></div>
    <div class="modal-row">
      <div class="modal-name" id="modalName"></div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-tags" id="modalTags"></div>
    <div class="modal-bio" id="modalBio"></div>
    <div class="modal-fav-btns">
      <button class="modal-fav-btn maybe"   id="modalMaybeBtn"  onclick="setMark('maybe')">? Maybe</button>
      <button class="modal-fav-btn mustsee" id="modalMustBtn"   onclick="setMark('mustsee')">★ Must-see</button>
    </div>
  </div>
</div>

// ── STATE ─────────────────────────────────────────────────────
function getDefaultDay() {
  // Poland is CEST = UTC+2 in June
  const nowUtc = Date.now();
  // 2026-06-06 04:00 CEST = 2026-06-06 02:00 UTC
  const cutoff = Date.UTC(2026, 5, 6, 2, 0, 0);
  return nowUtc < cutoff ? "fri" : "sat";
}

let currentDay = getDefaultDay();
let currentActId = null;

function saveFavorites() {
  db.ref(`favorites/${currentUser}`).set(Object.fromEntries(favorites));
}

// sync from Firebase in real-time
db.ref("favorites").on("value", snapshot => {
  const data = snapshot.val() || {};
  USERS.forEach(u => {
    allFavs[u.key] = new Map(Object.entries(data[u.key] || {}));
  });
  favorites = allFavs[currentUser];
  renderGrid(currentDay === "fri" ? FRIDAY : SATURDAY);
});

// ── TIME HELPERS ──────────────────────────────────────────────
function timeMins(str) {
  const [h, m] = str.replace(/\+/g, "").split(":").map(Number);
  const hour = h < TIME_START ? h + 24 : h;
  return (hour - TIME_START) * 60 + m;
}

function minsToY(mins) { return Math.round(mins * PX_PER_MIN); }

// ── CURRENT TIME LINE ─────────────────────────────────────────
// Grid sessions (Warsaw = UTC+2):
//   Fri grid: Jun 5 18:00 CEST → Jun 6 06:00 CEST  (UTC: Jun 5 16:00 → Jun 6 04:00)
//   Sat grid: Jun 6 18:00 CEST → Jun 7 06:00 CEST  (UTC: Jun 6 16:00 → Jun 7 04:00)
const GRID_STARTS_UTC = {
  fri: Date.UTC(2026, 5, 5, 16, 0, 0),
  sat: Date.UTC(2026, 5, 6, 16, 0, 0),
};

function getTimeLineY(day) {
  const elapsed = (Date.now() - GRID_STARTS_UTC[day]) / 60000; // minutes
  if (elapsed < 0 || elapsed > TIME_SPAN) return null;
  return minsToY(elapsed);
}

let timeLineInterval = null;

function updateTimeLine() {
  const y = getTimeLineY(currentDay);
  document.querySelectorAll(".time-now-line").forEach(el => {
    el.style.display = y === null ? "none" : "block";
    if (y !== null) el.style.top = y + "px";
  });
}

// ── TIMETABLE GRID RENDER ─────────────────────────────────────
function renderGrid(acts) {
  const totalW = TIME_COL_W + STAGES.length * STAGE_COL_W;

  const scroll = document.getElementById("timetable-scroll");
  const inner  = document.getElementById("timetable-inner");
  inner.style.width = totalW + "px";

  // ── STAGE HEADERS ──
  const headersEl = document.getElementById("stage-headers");
  headersEl.style.height = HEADER_H + "px";

  let html = `<div class="header-corner" style="width:${TIME_COL_W}px;height:${HEADER_H}px"></div>`;
  STAGES.forEach(s => {
    html += `<div class="stage-header-cell" style="width:${STAGE_COL_W}px;height:${HEADER_H}px">
      <div class="stage-header-name">${s.short}</div>
      <div class="stage-header-sub">${s.full}</div>
    </div>`;
  });
  headersEl.innerHTML = html;

  // ── GRID BODY ──
  const bodyEl = document.getElementById("grid-body");
  bodyEl.style.height = GRID_H + "px";

  // Time axis
  const timeAxis = document.getElementById("time-axis");
  timeAxis.style.cssText = `width:${TIME_COL_W}px;height:${GRID_H}px;position:sticky;left:0;flex-shrink:0;background:#0d0d0d;border-right:1px solid #1c1c1c;z-index:10;`;

  const hours = [18,19,20,21,22,23,0,1,2,3,4,5,6];
  let timeHtml = "";
  hours.forEach(h => {
    const normH = h < TIME_START ? h + 24 : h;
    const mins = (normH - TIME_START) * 60;
    const y = minsToY(mins);
    const label = String(h).padStart(2,"0") + ":00";
    timeHtml += `<div class="time-label hour" style="top:${y}px">${label}</div>`;
    // half-hour
    const halfY = minsToY(mins + 30);
    if (halfY < GRID_H) {
      timeHtml += `<div class="time-label" style="top:${halfY}px;font-size:9px;color:#333">${String(h).padStart(2,"0")}:30</div>`;
    }
  });
  timeAxis.innerHTML = timeHtml;

  // Remove old stage columns
  bodyEl.querySelectorAll(".stage-col").forEach(el => el.remove());

  // Stage columns
  STAGES.forEach(stage => {
    const col = document.createElement("div");
    col.className = "stage-col";
    col.style.cssText = `width:${STAGE_COL_W}px;height:${GRID_H}px;`;

    // Hour lines
    let lineHtml = "";
    hours.forEach(h => {
      const normH = h < TIME_START ? h + 24 : h;
      const y = minsToY((normH - TIME_START) * 60);
      lineHtml += `<div class="hour-line major" style="top:${y}px"></div>`;
      const halfY = minsToY((normH - TIME_START) * 60 + 30);
      if (halfY < GRID_H) lineHtml += `<div class="hour-line" style="top:${halfY}px"></div>`;
    });

    // Current time line (once per column)
    const timeLineY = getTimeLineY(currentDay);
    if (timeLineY !== null) {
      lineHtml += `<div class="time-now-line" style="top:${timeLineY}px"></div>`;
    }

    // Acts for this stage
    const stageActs = acts.filter(a => a.stageId === stage.id);
    stageActs.forEach(act => {
      const startMins = timeMins(act.start);
      const endMins   = timeMins(act.end);
      const top    = minsToY(startMins);
      const height = minsToY(endMins - startMins) - 2;
      const myMark = favorites.get(act.id) || "";
      const classes = ["act-block", act.headliner ? "headliner" : "", myMark].filter(Boolean).join(" ");

      const timeLabel = `${act.start}–${act.end}`;
      const displayName = act.name.replace(/\n/g, "<br>");

      const markers = USERS
        .filter(u => allFavs[u.key].has(act.id))
        .map(u => `<span class="act-marker ${allFavs[u.key].get(act.id)}">${u.name[0]}</span>`)
        .join("");

      lineHtml += `<div class="${classes}" id="act-${act.id}"
        style="top:${top + 2}px;height:${height}px"
        onclick="openModal('${act.id}')">
        <div class="act-name">${displayName}</div>
        <div class="act-time">${timeLabel}</div>
        ${markers ? `<div class="act-markers">${markers}</div>` : ""}
      </div>`;
    });

    col.innerHTML = lineHtml;
    bodyEl.appendChild(col);
  });

  // scroll to current time (or first act if no live session)
  const liveY = getTimeLineY(currentDay);
  const firstActMins = Math.min(...acts.map(a => timeMins(a.start)));
  scroll.scrollTop = liveY !== null
    ? Math.max(0, liveY - 80)
    : Math.max(0, minsToY(firstActMins) - 20);

  // update time line every minute
  if (timeLineInterval) clearInterval(timeLineInterval);
  timeLineInterval = setInterval(updateTimeLine, 60000);
}


// ── MODAL ─────────────────────────────────────────────────────
function openModal(id) {
  const act = [...FRIDAY, ...SATURDAY].find(a => a.id === id);
  if (!act) return;
  const bio = BIOS[id] || {};
  const stage = STAGES.find(s => s.id === act.stageId);

  currentActId = id;
  document.getElementById("modalName").textContent = act.name.replace(/\n/g, " ");

  const tags = [
    `<span class="modal-tag">${act.start}–${act.end}</span>`,
    `<span class="modal-tag">${stage?.full || ""}</span>`,
    bio.origin ? `<span class="modal-tag">${bio.origin}</span>` : "",
    ...(bio.genres || []).map(g => `<span class="modal-tag">${g}</span>`),
  ].join("");
  document.getElementById("modalTags").innerHTML = tags;
  document.getElementById("modalBio").textContent = bio.bio || "";

  updateModalBtns();
  document.getElementById("overlay").classList.add("open");
  document.body.style.overflow = "hidden";
}


function closeModal() {
  document.getElementById("overlay").classList.remove("open");
  currentActId = null;
}

function updateModalBtns() {
  const mark = favorites.get(currentActId);
  document.getElementById("modalMaybeBtn").classList.toggle("on", mark === "maybe");
  document.getElementById("modalMustBtn").classList.toggle("on",  mark === "mustsee");
}

function setMark(state) {
  if (!currentActId) return;
  if (favorites.get(currentActId) === state) favorites.delete(currentActId);
  else favorites.set(currentActId, state);
  saveFavorites();
  updateModalBtns();
}

// overlay backdrop dismiss
document.getElementById("overlay").addEventListener("click", e => {
  if (e.target === e.currentTarget) closeModal();
});

// swipe-down to close
let swipeStartY = 0;
document.getElementById("modal").addEventListener("touchstart", e => { swipeStartY = e.touches[0].clientY; }, { passive:true });
document.getElementById("modal").addEventListener("touchend",   e => { if (e.changedTouches[0].clientY - swipeStartY > 60) closeModal(); }, { passive:true });
